<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriVoisin</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f7f7f7;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: white;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.logo {
  font-weight: bold;
  font-size: 22px;
  color: #2e7d32;
}

nav a {
  margin: 0 15px;
  text-decoration: none;
  color: #333;
}

.auth button {
  margin-left: 10px;
  padding: 8px 15px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}

.signup {
  background: #2e7d32;
  color: white;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
  background: linear-gradient(#4caf50, #2e7d32);
  color: white;
}

.hero h1 {
  font-size: 40px;
}

.search-bar {
  margin-top: 20px;
}

.search-bar input {
  padding: 12px;
  width: 250px;
  border-radius: 6px;
  border: none;
}

.search-bar button {
  padding: 12px;
  border: none;
  background: #1b5e20;
  color: white;
  border-radius: 6px;
}

/* CATEGORIES */
.categories {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 30px;
  flex-wrap: wrap;
}

.cat {
  background: white;
  padding: 15px;
  border-radius: 10px;
  width: 120px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* PRODUCTS */
.products {
  padding: 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: #2e7d32;
  font-weight: bold;
}

.card button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #2e7d32;
  color: white;
  margin-top: 10px;
  cursor: pointer;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 30px;
  background: #eee;
}
</style>
</head>

<body>

<header>
  <div class="logo">🌱 AgriVoisin</div>
  <nav>
    <a href="#">Explorer</a>
    <a href="#">Vendre</a>
  </nav>
  <div class="auth">
    <button>Se connecter</button>
    <button class="signup">S'inscrire</button>
  </div>
</header>

<section class="hero">
  <h1>Le frais, tout près de chez vous</h1>
  <p>Achetez directement à vos voisins</p>
  <div class="search-bar">
    <input placeholder="Tomates, œufs, miel...">
    <button>Rechercher</button>
  </div>
</section>

<section class="categories">
  <div class="cat">🍅 Fruits</div>
  <div class="cat">🥚 Œufs</div>
  <div class="cat">🌱 Plantes</div>
  <div class="cat">🌸 Fleurs</div>
  <div class="cat">🍯 Maison</div>
</section>

<section class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce">
    <div class="card-content">
      <h3>Tomates du jardin</h3>
      <p class="price">4€ / panier</p>
      <p>Lunéville · 2 km</p>
      <button>Voir</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1589927986089-35812388d1f4">
    <div class="card-content">
      <h3>Œufs frais</h3>
      <p class="price">3€ / boîte</p>
      <p>Lunéville · 1 km</p>
      <button>Voir</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1587049352846-4a222e784d38">
    <div class="card-content">
      <h3>Miel maison</h3>
      <p class="price">6€ / pot</p>
      <p>Lunéville · 5 km</p>
      <button>Voir</button>
    </div>
  </div>

</section>

<footer>
  <p>© 2026 AgriVoisin</p>
</footer>

</body>
</html>
