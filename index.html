<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriVoisin</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffffff;
}

/* HEADER */
header {
  background: #1b5e20;
  color: white;
  padding: 20px;
  text-align: center;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 32px;
}

.hero p {
  color: #555;
}

.hero button {
  margin-top: 20px;
  padding: 12px 20px;
  background: #1b5e20;
  color: white;
  border: none;
  border-radius: 6px;
}

/* LISTE */
.listings {
  padding: 20px;
}

.card {
  background: #f5f5f5;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
}

.card h3 {
  margin: 0;
}

.price {
  color: #1b5e20;
  font-weight: bold;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: #1b5e20;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>🌱 AgriVoisin</h1>
</header>

<section class="hero">
  <h1>Achète local autour de toi</h1>
  <p>Fruits, légumes et produits maison sans intermédiaire</p>
  <button>Voir les annonces</button>
</section>

<section class="listings">

  <div class="card">
    <h3>🍅 Tomates</h3>
    <p class="price">4€/kg</p>
  </div>

  <div class="card">
    <h3>🥚 Œufs frais</h3>
    <p class="price">3€</p>
  </div>

</section>

<footer>
  © AgriVoisin
</footer>

</body>
</html>
