<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes annonces — Agrivoisin</title>
<meta name="description" content="Gérez vos annonces publiées sur Agrivoisin.">
<link rel="stylesheet" href="style.css">
<script src="supabase.js"></script>
</head>
<body>

<!-- ============ EN-TÊTE DE PAGE ============ -->
<section class="page-header" style="display:flex;align-items:stretch;justify-content:center;gap:0;">
  <div style="background:var(--white);border-radius:28px;box-shadow:var(--shadow-soft);padding:44px 40px;max-width:500px;width:100%;text-align:center;height:600px;box-sizing:border-box;display:flex;flex-direction:column;">
    <div style="text-align:left;margin:-24px 0 12px -20px;">
      <a href="index.html" class="btn btn-ghost">Retour</a>
    </div>
    <h1 style="font-size:1.2rem;">Mes annonces</h1>
    <p class="auth-subtitle" id="pageSubtitle" style="font-size:0.85rem;">Retrouvez et gérez les annonces que vous avez publiées.</p>

    <a href="horaires.html" id="pickupHoursLink" class="btn btn-ghost" style="display:none;align-self:center;margin:10px 0 4px;font-size:0.8rem;padding:6px 16px;">Mes horaires de retrait</a>

    <div id="notLoggedSection" style="display:none;">
      <p style="text-align:center;">Vous devez être connecté pour voir vos annonces. <a href="connexion.html" style="color:var(--leaf-deep);font-weight:700;">Se connecter</a></p>
    </div>

    <div id="notSellerSection" style="display:none;">
      <p style="text-align:center;margin-bottom:14px;">Vous n'avez pas encore de compte vendeur.</p>
      <a href="vendre.html" class="btn btn-primary">Devenir vendeur</a>
    </div>

    <p id="listingsError" style="color:#C8352F;display:none;margin-top:10px;"></p>

    <div id="listingsNavWrap" style="display:none;overflow-y:auto;flex:1;min-height:0;">
      <button type="button" id="prevListingBtn" class="btn btn-ghost" aria-label="Annonce précédente" style="width:100%;margin-top:10px;font-size:0.7rem;padding:4px;">▲</button>
      <div id="myListingsContainer" style="text-align:left;"></div>
      <button type="button" id="nextListingBtn" class="btn btn-ghost" aria-label="Annonce suivante" style="width:100%;margin-top:10px;font-size:0.7rem;padding:4px;">▼</button>
    </div>
  </div>
  <div style="width:500px;height:600px;display:flex;align-items:center;justify-content:center;background:var(--cream-soft);border-radius:28px;">
      <video src="papy-video2.mp4" autoplay muted playsinline style="width:480px;height:580px;object-fit:contain;display:block;border-radius:20px;"></video>
  </div>
</section>

<style>
  .order-card { background:#f9f7f2; border-radius:12px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
  .order-card h3 { margin-bottom:8px; font-size:0.9rem; }
  .edit-listing-form { display:flex; flex-direction:column; gap:2px; }
  .edit-listing-form label { font-size:0.7rem; font-weight:600; color:#4C7A50; margin-top:5px; }
  .edit-listing-form input { padding:6px 8px; border-radius:8px; border:1.5px solid rgba(107,88,66,0.2); font-family:inherit; font-size:0.8rem; }
  .edit-listing-form input:focus { outline:none; border-color:#4C7A50; }
  .edit-listing-form .btn { font-size:0.75rem; padding:6px 14px; }
</style>

<script src="script.js"></script>
<script>
  const supabaseClient = window.supabase.createClient(
    'https://eipksfszadhratfvavvs.supabase.co',
    'sb_publishable_sId6ddmX1-3OJOBnVuTLNQ_gAVNQ0Yo'
  );

  const errorEl = document.getElementById('listingsError');
  const container = document.getElementById('myListingsContainer');
  const notLoggedSection = document.getElementById('notLoggedSection');
  const notSellerSection = document.getElementById('notSellerSection');
  const pageSubtitle = document.getElementById('pageSubtitle');
  const listingsNavWrap = document.getElementById('listingsNavWrap');
  const prevBtn = document.getElementById('prevListingBtn');
  const nextBtn = document.getElementById('nextListingBtn');

  let allListings = [];
  let currentIndex = 0;

  function buildListingCardHtml(item) {
    return (
      '<div class="order-card">' +
      '<form class="edit-listing-form" data-id="' + item.id + '">' +
      '<h3>' + item.title + '</h3>' +
      '<label>Titre</label>' +
      '<input type="text" name="title" value="' + item.title + '" required>' +
      '<label>Description</label>' +
      '<input type="text" name="description" value="' + (item.description || '') + '">' +
      '<label>Prix (euros)</label>' +
      '<input type="number" step="0.01" name="price" value="' + item.price + '" required>' +
      '<label>Unite</label>' +
      '<input type="text" name="unit" value="' + (item.unit || '') + '">' +
      '<label>Lien photo</label>' +
      '<input type="text" name="imageUrl" value="' + (item.image_url || '') + '">' +
      '<div style="display:flex;gap:10px;margin-top:12px;">' +
      '<button type="submit" class="btn btn-primary">Enregistrer</button>' +
      '<button type="button" class="btn btn-ghost delete-btn" data-id="' + item.id + '">Supprimer</button>' +
      '</div>' +
      '<p class="edit-msg" style="margin-top:8px;display:none;"></p>' +
      '</form>' +
      '</div>'
    );
  }

  function attachHandlersToCurrentForm() {
    const form = container.querySelector('.edit-listing-form');
    if (!form) return;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const listingId = form.getAttribute('data-id');
      const msgEl = form.querySelector('.edit-msg');

      const { data: { session } } = await supabaseClient.auth.getSession();

      const payload = {
        listingId: listingId,
        title: form.title.value,
        description: form.description.value,
        price: parseFloat(form.price.value),
        unit: form.unit.value,
        imageUrl: form.imageUrl.value,
      };

      try {
        const r = await fetch('/api/update-listing', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + session.access_token,
          },
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Erreur');

        allListings[currentIndex] = {
          ...allListings[currentIndex],
          title: payload.title,
          description: payload.description,
          price: payload.price,
          unit: payload.unit,
          image_url: payload.imageUrl,
        };

        msgEl.textContent = 'Annonce mise a jour !';
        msgEl.style.color = '#4C7A50';
        msgEl.style.display = 'block';
      } catch (err) {
        msgEl.textContent = 'Erreur : ' + err.message;
        msgEl.style.color = '#C8352F';
        msgEl.style.display = 'block';
      }
    });

    const deleteBtn = form.querySelector('.delete-btn');
    deleteBtn.addEventListener('click', async function () {
      if (!confirm('Supprimer definitivement cette annonce ?')) return;

      const listingId = deleteBtn.getAttribute('data-id');
      const { data: { session } } = await supabaseClient.auth.getSession();

      try {
        const r = await fetch('/api/delete-listing', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + session.access_token,
          },
          body: JSON.stringify({ listingId: listingId }),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Erreur');

        allListings.splice(currentIndex, 1);

        if (allListings.length === 0) {
          listingsNavWrap.style.display = 'none';
          container.innerHTML = "<p>Vous n'avez pas encore publié d'annonce.</p>";
          return;
        }

        if (currentIndex >= allListings.length) {
          currentIndex = allListings.length - 1;
        }
        renderCurrentListing();
      } catch (err) {
        alert('Erreur : ' + err.message);
      }
    });
  }

  function renderCurrentListing() {
    container.innerHTML = buildListingCardHtml(allListings[currentIndex]);
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === allListings.length - 1;
    attachHandlersToCurrentForm();
  }

  prevBtn.addEventListener('click', () => {
    if (currentIndex > 0) {
      currentIndex--;
      renderCurrentListing();
    }
  });

  nextBtn.addEventListener('click', () => {
    if (currentIndex < allListings.length - 1) {
      currentIndex++;
      renderCurrentListing();
    }
  });

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      notLoggedSection.style.display = 'block';
      pageSubtitle.style.display = 'none';
      return;
    }

    try {
      const response = await fetch('/api/get-seller-listings', {
        headers: { Authorization: 'Bearer ' + session.access_token },
      });
      const data = await response.json();

      if (!response.ok) {
        if (data.error && data.error.includes('vendeur')) {
          pageSubtitle.style.display = 'none';
          notSellerSection.style.display = 'block';
          return;
        }
        throw new Error(data.error || 'Erreur');
      }

      pageSubtitle.style.display = 'none';
      document.getElementById('pickupHoursLink').style.display = 'inline-block';
      allListings = data.listings || [];

      if (allListings.length === 0) {
        container.innerHTML = "<p>Vous n'avez pas encore publié d'annonce.</p>";
        listingsNavWrap.style.display = 'block';
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        return;
      }

      listingsNavWrap.style.display = 'block';
      renderCurrentListing();

    } catch (err) {
      errorEl.textContent = 'Erreur : ' + err.message;
      errorEl.style.display = 'block';
    }
  }

  init();
</script>
</body>
</html>
