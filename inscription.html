<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Agrivoisin</title>
<meta name="description" content="Créez votre compte Agrivoisin, jardinier ou acheteur.">
<link rel="stylesheet" href="style.css">
<script src="supabase.js"></script>
</head>
<body>

<!-- ============ FORMULAIRE INSCRIPTION ============ -->
<section style="display:flex;align-items:stretch;justify-content:center;gap:0;">
  <div class="auth-card auth-card-wide">
    <div style="text-align:left;margin:-24px 0 12px -20px;">
      <a href="index.html" class="btn btn-ghost">Retour</a>
    </div>
    <h1>Rejoindre Agrivoisin</h1>
    <p class="auth-subtitle">Créez votre compte pour vendre vos récoltes ou dénicher celles de vos voisins.</p>

    <div class="account-type-toggle">
      <button type="button" class="account-type-btn account-type-active" data-type="acheteur" style="background-image:url('panier-agrivoisin.png');background-size:cover;background-position:center;position:relative;color:#fff;justify-content:flex-start;">
        <span style="background:rgba(0,0,0,0.55);padding:6px 14px;border-radius:999px;">Je veux acheter</span>
      </button>
      <button type="button" class="account-type-btn" data-type="jardinier">
        <span class="account-type-emoji">🌱</span>
        Je veux vendre
      </button>
    </div>

    <form class="auth-form" id="signupForm">
      <label for="name">Nom complet</label>
      <input type="text" id="name" placeholder="Votre nom" required>

      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" placeholder="vous@exemple.com" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="8 caractères minimum" minlength="8" required>

      <label for="city">Ville</label>
      <input type="text" id="city" placeholder="Votre ville" required>

      <label for="sellerAddress" id="sellerAddressLabel" style="display:none;">Adresse complète (sera communiquée à l'acheteur après paiement uniquement)</label>
      <input type="text" id="sellerAddress" placeholder="Ex : 12 rue des Jardins, 75000 Paris" style="display:none;">

      <button type="submit" class="btn btn-primary auth-submit" id="signupBtn">Créer mon compte</button>
    </form>

    <p class="auth-switch" id="signupError" style="color:#C8352F;display:none;"></p>
    <p class="auth-switch" id="signupSuccess" style="color:#4C7A50;display:none;"></p>

    <p class="auth-switch">Déjà un compte ? <a href="connexion.html">Se connecter</a></p>
  </div>
  <div style="width:480px;align-self:stretch;background:var(--cream-soft);border-radius:28px;display:flex;align-items:center;justify-content:center;">
    <img src="agrivoisin-logo-final.png" alt="Agrivoisin - Le frais tout près" style="width:auto;height:auto;max-width:95%;max-height:95%;">
  </div>
</section>

<script src="script.js"></script>
<script>
  const supabaseClient = window.supabase.createClient(
    'https://eipksfszadhratfvavvs.supabase.co',
    'sb_publishable_sId6ddmX1-3OJOBnVuTLNQ_gAVNQ0Yo'
  );

  let selectedType = 'acheteur';
  const sellerAddressLabel = document.getElementById('sellerAddressLabel');
  const sellerAddressInput = document.getElementById('sellerAddress');

  document.querySelectorAll('.account-type-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.account-type-btn').forEach((b) => b.classList.remove('account-type-active'));
      btn.classList.add('account-type-active');
      selectedType = btn.dataset.type;

      if (selectedType === 'jardinier') {
        sellerAddressLabel.style.display = '';
        sellerAddressInput.style.display = '';
        sellerAddressInput.required = true;
      } else {
        sellerAddressLabel.style.display = 'none';
        sellerAddressInput.style.display = 'none';
        sellerAddressInput.required = false;
      }
    });
  });

  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('signupBtn');
    const errorEl = document.getElementById('signupError');
    const successEl = document.getElementById('signupSuccess');

    btn.textContent = 'Création en cours...';
    btn.disabled = true;
    errorEl.style.display = 'none';
    successEl.style.display = 'none';

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const city = document.getElementById('city').value;
    const sellerAddress = sellerAddressInput.value;

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: name,
          role: selectedType,
          city: city,
        },
      },
    });

    if (error) {
      errorEl.textContent = 'Erreur : ' + error.message;
      errorEl.style.display = 'block';
      btn.textContent = 'Créer mon compte';
      btn.disabled = false;
      return;
    }

    if (selectedType !== 'jardinier') {
      successEl.textContent = 'Compte créé avec succès ! Vous pouvez maintenant vous connecter.';
      successEl.style.display = 'block';
      document.getElementById('signupForm').reset();
      btn.textContent = 'Créer mon compte';
      btn.disabled = false;
      return;
    }

    try {
      btn.textContent = 'Création du compte de paiement...';

      const { data: sessionData } = await supabaseClient.auth.signInWithPassword({ email, password });
      const accessToken = sessionData.session.access_token;

      const response = await fetch('/api/create-connect-account', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + accessToken,
        },
        body: JSON.stringify({ email, city, address: sellerAddress }),
      });

      const stripeData = await response.json();

      if (!response.ok) {
        throw new Error(stripeData.error || 'Une erreur est survenue');
      }

      window.location.href = stripeData.onboardingUrl;

    } catch (err) {
      errorEl.textContent = 'Votre compte a été créé, mais la création du compte de paiement a échoué : ' + err.message + '. Connectez-vous puis réessayez depuis "Devenir vendeur".';
      errorEl.style.display = 'block';
      btn.textContent = 'Créer mon compte';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
